<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 재고 조회 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div
        class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 transform transition-all hover:scale-[1.01] duration-300">
        <div class="text-center mb-8">
            <div class="mx-auto w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                <span class="material-symbols-outlined text-blue-600 text-3xl">inventory_2</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">재고 조회 시스템</h1>
            <p class="text-gray-500 text-sm">NSS Stock Management System</p>
        </div>

        <div class="space-y-4">
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-6">
                <div class="flex items-start">
                    <span class="material-symbols-outlined text-blue-600 mr-2 mt-0.5 text-lg">info</span>
                    <p class="text-sm text-blue-800">
                        보안을 위해 허용된 Google 계정으로만<br>로그인할 수 있습니다.
                    </p>
                </div>
            </div>

            <a href="/login/google"
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-3 px-4 rounded-lg transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google Logo">
                <span>Google 계정으로 로그인</span>
            </a>

            <p class="text-center text-xs text-gray-400 mt-8">
                &copy; 2026 Ocean Technology. All rights reserved.
            </p>
        </div>
    </div>
</body>

</html>
